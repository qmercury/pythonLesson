name: MQTT IoT lesson validation

on:
  push:
    paths:
      - 'examples/mqtt-iot/**'
      - 'tests/test_mqtt_protocol.py'
      - '.github/workflows/mqtt-lessons.yml'
  pull_request:
    paths:
      - 'examples/mqtt-iot/**'
      - 'tests/test_mqtt_protocol.py'
      - '.github/workflows/mqtt-lessons.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile classroom examples
        run: python -m py_compile examples/mqtt-iot/*.py tests/test_mqtt_protocol.py
      - name: Test safe MQTT message protocol
        run: python -m unittest discover -s tests -p 'test_mqtt_protocol.py' -v
